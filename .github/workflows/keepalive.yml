name: Keepalive

# Keeps the free-tier Supabase project from auto-pausing and checks that the
# site and API are up. A failed run emails the repo owner. See docs/keepalive.md.
on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://fgoqijltbhkrztxjebjm.supabase.co' }}
      # Publishable key is public by design (shipped in the frontend bundle).
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_3lUk_Nx9Ev01e10yqTsr7w_agF_x8ju' }}
    steps:
      - name: Site is up
        run: |
          code=$(curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "https://sinc-crm.benlester.me/")
          echo "site: HTTP $code"

      - name: Worker is up
        run: |
          code=$(curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "https://sinc-crm-api.prinxlexter.workers.dev/api/health")
          echo "worker: HTTP $code"

      - name: Supabase Postgres query
        run: |
          code=$(curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/clients?select=id&limit=1")
          echo "supabase: HTTP $code"
          [ "$code" = "200" ]

# Cloudflare Worker — SINC CRM API
# Runtime secrets (production): SUPABASE_URL, SUPABASE_SECRET_KEY, CORS_ORIGINS (Pass 2)
#   npx wrangler secret put <NAME>  |  secret bulk <file>  — see docs/deploy-guide.md
#   worker/.dev.vars is for wrangler dev only — not uploaded on deploy
# Deploy: npm run deploy:worker (from repo root)

name = "sinc-crm-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787
